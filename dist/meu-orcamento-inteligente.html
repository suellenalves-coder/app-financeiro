<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FAF8F2">
  <title>Meu Orçamento Inteligente</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
  <style>
/* Meu Orçamento Inteligente — identidade visual clean em tons pastéis. */
:root {
  --off-white: #FAF8F2;
  --bege: #EDE3D4;
  --cinza-gelo: #EEF1F4;
  --menta: #BFE8D5;
  --lilas: #D9CCF2;
  --ceu: #C9E7F6;
  --rosa: #F4D6DA;
  --ink: #2F3437;
  --ink-2: #6B7280;
  --alerta: #F6C667;
  --erro: #E57373;
  --sucesso: #7BC99A;
  --surface: #FFFFFF;
  --border: #E7E2D6;
  --shadow: 0 1px 3px rgba(47, 52, 55, .06), 0 4px 14px rgba(47, 52, 55, .05);
  --radius: 14px;
  --sidebar-w: 232px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; overflow-x: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
  background: var(--off-white);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.45;
}
h1, h2, h3 { margin: 0; font-weight: 600; }
button { font: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--ink); }

/* ---- Layout ---- */
.app { display: flex; min-height: 100vh; }
.sidebar {
  width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border);
  padding: 20px 12px; position: fixed; top: 0; bottom: 0; overflow-y: auto; z-index: 20;
}
.logo { font-size: 17px; font-weight: 700; padding: 4px 12px 18px; letter-spacing: -.2px; }
.logo small { display: block; font-size: 11px; font-weight: 500; color: var(--ink-2); }
.nav-link {
  display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px;
  color: var(--ink-2); text-decoration: none; font-size: 14px; margin-bottom: 2px;
}
.nav-link:hover { background: var(--cinza-gelo); color: var(--ink); }
.nav-link.active { background: var(--menta); color: var(--ink); font-weight: 600; }
.nav-icon { width: 20px; text-align: center; }

.main { flex: 1; min-width: 0; margin-left: var(--sidebar-w); padding: 20px 24px 90px; max-width: 1200px; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.topbar h1 { font-size: 21px; }

.month-picker {
  display: flex; align-items: center; gap: 4px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 999px; padding: 4px 6px; box-shadow: var(--shadow);
}
.month-picker .month-label { min-width: 140px; text-align: center; font-weight: 600; font-size: 14px; text-transform: capitalize; }
.month-picker button { border: none; background: none; border-radius: 999px; width: 28px; height: 28px; color: var(--ink-2); }
.month-picker button:hover { background: var(--cinza-gelo); }

/* ---- Cards ---- */
.card {
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 18px; margin-bottom: 16px; border: 1px solid rgba(231, 226, 214, .6);
  min-width: 0; max-width: 100%;
}
.card-title { font-size: 15px; margin-bottom: 12px; color: var(--ink); }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.card-head .card-title { margin-bottom: 0; }

.card-details { border-top: 1px solid var(--border); margin-top: 14px; padding-top: 12px; }
.card-details summary {
  cursor: pointer; font-size: 14px; font-weight: 600; color: var(--ink); list-style: none;
}
.card-details summary::-webkit-details-marker { display: none; }
.card-details summary::before { content: '▸ '; color: var(--ink-2); }
.card-details[open] summary::before { content: '▾ '; }
.card-details .table-scroll, .card-details .empty-state { margin-top: 10px; }

.grid { display: grid; gap: 12px; }
.grid-cards { grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); margin-bottom: 16px; }
.grid-2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
@media (max-width: 860px) { .grid-2 { grid-template-columns: 1fr; } }

.stat-card {
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 14px 16px; border: 1px solid rgba(231, 226, 214, .6);
}
.stat-card.clickable { cursor: pointer; }
.stat-card.clickable:hover { border-color: var(--menta); }
.stat-label { font-size: 12px; color: var(--ink-2); margin-bottom: 4px; }
.stat-value { font-size: 19px; font-weight: 700; letter-spacing: -.3px; }
.stat-sub { font-size: 12px; color: var(--ink-2); margin-top: 3px; }
.stat-card.tone-ok { background: linear-gradient(180deg, #f2fbf6, var(--surface)); }
.stat-card.tone-ok .stat-value { color: #2E7D53; }
.stat-card.tone-bad .stat-value { color: var(--erro); }
.stat-card.tone-warn .stat-value { color: #B8862F; }
.stat-card.tone-accent { background: linear-gradient(180deg, #f4f0fc, var(--surface)); }

/* ---- Alertas ---- */
.alerts { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.alert { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 12px; font-size: 14px; }
.alert-erro { background: #FDECEC; border: 1px solid #F3C1C1; }
.alert-aviso { background: #FCF3DD; border: 1px solid #F0DCAE; }
.alert-info { background: var(--cinza-gelo); border: 1px solid #DDE3E9; }

/* ---- Tabelas ---- */
.table-scroll { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.table th {
  text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .4px;
  color: var(--ink-2); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.table td { padding: 9px 10px; border-bottom: 1px solid #F1EEE5; vertical-align: middle; }
.table tr:last-child td { border-bottom: none; }
.table tr:hover td { background: #FBFAF6; }
.table .right { text-align: right; }
.table tfoot td, .table .total-row td { font-weight: 700; border-top: 2px solid var(--border); }

/* ---- Badges ---- */
.badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.badge-ok { background: #E3F5EB; color: #2E7D53; }
.badge-bad { background: #FDECEC; color: #C0504D; }
.badge-warn { background: #FCF3DD; color: #9A7220; }
.badge-info { background: var(--ceu); color: #2C6284; }
.badge-muted { background: var(--cinza-gelo); color: var(--ink-2); }

/* ---- Botões ---- */
.btn {
  border: none; border-radius: 10px; padding: 8px 16px; font-size: 14px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn-primary { background: var(--menta); color: var(--ink); }
.btn-primary:hover { background: #ADDFC6; }
.btn-secondary { background: var(--lilas); color: var(--ink); }
.btn-secondary:hover { background: #CBBAEC; }
.btn-ghost { background: transparent; color: var(--ink-2); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--cinza-gelo); }
.btn-danger { background: #F8DCDC; color: #B44B48; }
.btn-sm { padding: 5px 11px; font-size: 13px; border-radius: 8px; }
.icon-btn {
  border: none; background: transparent; border-radius: 8px; padding: 4px 7px;
  color: var(--ink-2); font-size: 14px;
}
.icon-btn:hover { background: var(--cinza-gelo); color: var(--ink); }
.row-actions { display: flex; gap: 2px; justify-content: flex-end; }

.fab {
  position: fixed; right: 22px; bottom: 84px; z-index: 30;
  width: 54px; height: 54px; border-radius: 50%; border: none;
  background: var(--menta); color: var(--ink); font-size: 26px; box-shadow: 0 4px 16px rgba(47, 52, 55, .18);
}
@media (min-width: 861px) { .fab { bottom: 26px; } }

/* ---- Formulários ---- */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
@media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } }
.form-field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.form-full { grid-column: 1 / -1; }
.form-label { color: var(--ink-2); font-weight: 600; font-size: 12px; }
.form-field input:not([type=checkbox]), .form-field select, .form-field textarea {
  border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; background: var(--off-white);
  outline: none; width: 100%;
}
.form-field input:focus, .form-field select:focus, .form-field textarea:focus { border-color: var(--menta); background: var(--surface); }
.form-check { flex-direction: row; align-items: center; gap: 8px; padding-top: 18px; font-size: 14px; }
.form-check input { width: 17px; height: 17px; accent-color: #2E9E63; }
.form-help { color: var(--ink-2); }
.form-error { color: var(--erro); font-size: 13px; margin-top: 10px; }

/* ---- Modal ---- */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(47, 52, 55, .35); z-index: 50;
  display: flex; align-items: flex-start; justify-content: center; padding: 30px 14px; overflow-y: auto;
}
.modal {
  background: var(--surface); border-radius: 16px; box-shadow: 0 12px 40px rgba(0, 0, 0, .18);
  width: 100%; max-width: 560px; animation: pop .15s ease-out;
}
.modal-wide { max-width: 860px; }
@keyframes pop { from { transform: scale(.97); opacity: 0; } }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px 0; }
.modal-head h3 { font-size: 16px; }
.modal-body { padding: 16px 20px 20px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

/* ---- Gráficos ---- */
.chart-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 0; max-width: 100%; }
.chart-scroll { overflow-x: auto; width: 100%; min-width: 0; }
.chart { display: block; max-width: 100%; height: auto; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; font-size: 12px; color: var(--ink-2); }
.legend-item { display: inline-flex; align-items: center; gap: 6px; }
.legend-dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.chart-tip {
  position: fixed; z-index: 100; background: var(--ink); color: #fff; font-size: 12px;
  padding: 6px 10px; border-radius: 8px; pointer-events: none; line-height: 1.5;
}
.chart-empty, .empty-state { color: var(--ink-2); font-size: 14px; padding: 22px 10px; text-align: center; }

/* ---- Calendário ---- */
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-dow { font-size: 11px; text-transform: uppercase; color: var(--ink-2); text-align: center; padding: 4px 0; font-weight: 600; }
.cal-day {
  min-height: 74px; background: var(--surface); border: 1px solid #F0EDE4; border-radius: 10px;
  padding: 5px 6px; font-size: 11.5px; cursor: pointer; overflow: hidden;
}
.cal-day:hover { border-color: var(--menta); }
.cal-day.other { background: transparent; border-color: transparent; cursor: default; }
.cal-day.today { border-color: #2E9E63; border-width: 2px; }
.cal-num { font-weight: 600; color: var(--ink-2); margin-bottom: 3px; }
.cal-item {
  display: flex; align-items: center; gap: 4px; border-radius: 6px; padding: 1px 5px; margin-bottom: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 10.5px;
}
.cal-more { color: var(--ink-2); font-size: 10.5px; }

/* ---- Toast ---- */
.toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(12px);
  background: var(--ink); color: #fff; padding: 10px 20px; border-radius: 999px; font-size: 14px;
  opacity: 0; transition: all .25s; z-index: 90; box-shadow: 0 6px 20px rgba(0, 0, 0, .2); max-width: 90vw;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---- Barra de comprometimento ---- */
.commit-meter { height: 12px; border-radius: 999px; background: var(--cinza-gelo); overflow: hidden; margin: 8px 0 4px; }
.commit-meter > div { height: 100%; border-radius: 999px; transition: width .3s; }

/* ---- Filtros ---- */
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
.filters select, .filters input {
  border: 1px solid var(--border); border-radius: 10px; padding: 6px 10px; background: var(--surface); font-size: 13px;
}

/* ---- Checklist de fechamento ---- */
.check-item { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid #F1EEE5; font-size: 14px; }
.check-item:last-child { border-bottom: none; }
.check-mark { font-size: 16px; line-height: 1.3; }

/* ---- Onboarding ---- */
.onboard-step { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid #F1EEE5; }
.onboard-step:last-child { border-bottom: none; }
.onboard-num {
  width: 26px; height: 26px; border-radius: 50%; background: var(--lilas); color: var(--ink);
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0;
}

/* ---- Mobile: menu inferior ---- */
.bottom-nav {
  display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 4px 2px calc(4px + env(safe-area-inset-bottom)); overflow-x: auto;
}
.bottom-nav a {
  flex: 1; min-width: 62px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: 10px; color: var(--ink-2); text-decoration: none; padding: 5px 2px; border-radius: 10px;
}
.bottom-nav a.active { color: var(--ink); background: var(--menta); font-weight: 600; }
.bottom-nav .nav-icon { font-size: 18px; }

@media (max-width: 860px) {
  .sidebar { display: none; }
  .main { margin-left: 0; padding: 14px 12px 100px; }
  .bottom-nav { display: flex; }
  .topbar h1 { font-size: 18px; }
  .grid-cards { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .stat-value { font-size: 16px; }
}

@media print {
  .sidebar, .bottom-nav, .fab, .topbar .month-picker { display: none; }
  .main { margin: 0; }
}

</style>

function mergeById(a, b, deleted, bWinsTies) {

  putAll(a, !bWinsTies);
  putAll(b, bWinsTies);
  return [...map.values()];
}

// evita "XP" em dobro quando os dois aparelhos fizeram o onboarding separadamente.

        categoria: exp.categoria,
      });
    } else {
      db.reimbursements.push({
        id: uid(), expenseId: exp.id, pessoaId: exp.pessoaId,
        descricao: exp.descricao, data: exp.dataCompra, categoria: exp.categoria,

function importRows(text) {
  const { rows } = parseTable(text);
  if (!rows.length) return { error: 'Nenhuma linha encontrada. Cole os dados com a linha de cabeçalho.' };
  const col = (r, ...names) => {
    for (const n of names) {
      const key = Object.keys(r).find(k => k.replace(/[\s_-]/g, '') === n.replace(/[\s_-]/g, ''));
      if (key && r[key] !== '') return r[key];
    }
    return '';

    const descricao = col(r, 'descricao', 'descrição', 'item');
    const valorTotal = parseMoney(col(r, 'valor', 'valor_total', 'valor total'));
    if (!descricao || !valorTotal) { errors.push(idx + 2); return; }

    const dataCompra = parseDate(col(r, 'data_compra', 'data da compra', 'data')) || todayISO();

// ---- Geração de parcelas de uma compra ----
function generateInstallments(purchase) {
  const total = Number(purchase.numParcelas) || 1;
  const inicial = Number(purchase.parcelaInicial) || 1;
  const valor = Number(purchase.valorParcela) || (Number(purchase.valorTotal) || 0) / total;
  const out = [];
  for (let n = inicial; n <= total; n++) {
    out.push({
      id: uid(),
      purchaseId: purchase.id,
      cartaoId: purchase.cartaoId,
      numero: n,
      total,
      parcelaInicial: inicial,
      valor,
      mes: ymAdd(purchase.mesInicio, n - inicial),
      status: 'previsto',
    });
  }
  return out;
}

// Ao salvar uma compra reembolsável, cria/atualiza UM REEMBOLSO POR MÊS (por parcela) —
// assim dá pra dizer exatamente quanto a pessoa deve *naquele mês*, sem retrabalho.
// A chave de sincronização é (purchaseId, mês da parcela): estável mesmo quando a compra
// é editada e as parcelas são regeradas com novos ids. Reembolsos já pagos/parciais nunca
// são apagados ou sobrescritos — preserva o histórico de recebimento.
function syncReimbursementsForPurchase(purchase, installments) {
  const existing = db.reimbursements.filter(r => r.purchaseId === purchase.id);
  const querReembolso = purchase.reembolsavel && purchase.pessoaId && Number(purchase.valorReembolsavel) > 0;

  if (!querReembolso) {
    for (const r of existing) if (['pendente', 'solicitado'].includes(r.status)) removeWhere('reimbursements', x => x.id === r.id);
    return;
  }

  // Migração de dados antigos: um reembolso único sem mês definido (de uma versão anterior
  // do app, que não dividia por parcela) é substituído pelos lançamentos mensais corretos,
  // desde que ainda não tenha recebimento registrado.
  for (const r of existing) {
    if (!r.mes && ['pendente', 'solicitado'].includes(r.status)) removeWhere('reimbursements', x => x.id === r.id);
  }
  const restantes = existing.filter(r => r.mes || ['pago', 'parcial'].includes(r.status));

  const card = db.cards.find(c => c.id === purchase.cartaoId);
  const totalParcelas = installments.length || 1;
  const valorPorMes = Number(purchase.valorReembolsavel) / totalParcelas;
  const mesesAtuais = new Set(installments.map(p => p.mes));

  for (const p of installments) {
    const found = restantes.find(r => r.mes === p.mes);
    if (found) {
      if (!['pago', 'parcial'].includes(found.status)) {
        update('reimbursements', found.id, {
          pessoaId: purchase.pessoaId, valorAReembolsar: +valorPorMes.toFixed(2),
          descricao: purchase.descricao, categoria: purchase.categoria, valorTotalDespesa: Number(p.valor),
        });
      }
    } else {
      add('reimbursements', {
        purchaseId: purchase.id, mes: p.mes, pessoaId: purchase.pessoaId,
        descricao: purchase.descricao, data: dateInMonth(p.mes, Number(card?.diaVencimento) || 1),
        categoria: purchase.categoria, valorTotalDespesa: Number(p.valor), criterio: 'fixo', percentual: '',
        valorAReembolsar: +valorPorMes.toFixed(2), valorRecebido: 0,
        status: 'pendente', dataSolicitacao: '', dataRecebimento: '', obs: '',
      });
    }
  }
  // Parcela removida (reduziu o número de parcelas): some o reembolso daquele mês, se ainda não foi pago.
  for (const r of restantes) {
    if (r.mes && !mesesAtuais.has(r.mes) && ['pendente', 'solicitado'].includes(r.status)) {
      removeWhere('reimbursements', x => x.id === r.id);
    }
  }
}

function savePurchase(vals, existingId) {
  let purchase, installments;
  if (existingId) {
    // Regerar parcelas mantendo status pago das já quitadas quando possível
    removeWhere('installments', p => p.purchaseId === existingId);
    purchase = update('purchases', existingId, vals);
    installments = generateInstallments(purchase);
    db.installments.push(...installments);
  } else {
    purchase = add('purchases', vals);
    installments = generateInstallments(purchase);
    db.installments.push(...installments);
  }
  syncReimbursementsForPurchase(purchase, installments);
  save();
}

// Autocorreção: compras reembolsáveis cadastradas antes desta versão (ou nunca reeditadas)
// ainda têm um reembolso único e não dividido por parcela. Chamada sempre que as telas de
// Cartões ou Reembolsos abrem — sincroniza tudo em silêncio, sem exigir reedição manual.
function ensureReimbursementSync() {
  for (const purchase of db.purchases) {
    if (!purchase.reembolsavel) continue;
    const installments = db.installments.filter(i => i.purchaseId === purchase.id);
    if (!installments.length) continue;
    syncReimbursementsForPurchase(purchase, installments);
  }
}

// Tabela reutilizável de compras parceladas — usada agrupada dentro de cada cartão
// e, em caso de compra órfã (cartão excluído/inativo), num bloco à parte.
function purchasesTable(list, ym, rerender, { showCartao = false } = {}) {
  const purchases = [...list].sort((a, b) => (b.mesInicio || '').localeCompare(a.mesInicio || ''));
  const cols = [
    { label: 'Descrição', render: p => h('span', {}, p.descricao,
        p.reembolsavel ? h('span', { title: `Reembolsável${p.pessoaId ? ' — ' + (db.people.find(x => x.id === p.pessoaId)?.nome || '') : ''}`, style: 'margin-left:5px' }, '🤝') : null) },
    showCartao ? { label: 'Cartão', render: p => db.cards.find(c => c.id === p.cartaoId)?.nome || '— (excluído/inativo)' } : null,
    { label: 'Categoria', k: 'categoria' },
    { label: 'Parcelas', render: p => `${p.numParcelas}× de ${fmt(p.valorParcela || (p.valorTotal / p.numParcelas))}` },
    { label: 'Início', render: p => ymShort(p.mesInicio) },
    { label: 'Restante', render: p => fmt(sum(db.installments.filter(i => i.purchaseId === p.id && i.status !== 'pago' && ymDiff(i.mes, ym) >= 0), i => i.valor)), right: true },
    { label: '', render: p => rowActions(
        ['✏️', () => formModal('Editar compra parcelada', purchaseFields(), p, vals => { savePurchase(vals, p.id); rerender(); }, { wide: true }), 'Editar'],
        ['🗑', () => confirmModal(`Excluir "${p.descricao}" e todas as suas parcelas?${p.reembolsavel ? ' Os reembolsos vinculados ainda não recebidos também serão removidos.' : ''}`, () => {
          removeWhere('installments', i => i.purchaseId === p.id);
          removeWhere('reimbursements', r => r.purchaseId === p.id && ['pendente', 'solicitado'].includes(r.status));
          remove('purchases', p.id);
          rerender();
        }), 'Excluir']), right: true },
  ].filter(Boolean);
  return table(cols, purchases, { empty: 'Nenhuma compra parcelada. Use a importação em massa para carregar as existentes.' });
}

function renderFutureMap(ym) {
  const horizon = 18;
  const rows = [];
  for (let i = 0; i < horizon; i++) {
    const m = ymAdd(ym, i);
    const parcelas = monthInstallments(m);
    if (!parcelas.length) continue;
    const totalMes = sum(parcelas, p => p.valor);
    for (const p of parcelas) {
      const compra = db.purchases.find(x => x.id === p.purchaseId);
      rows.push({
        mes: ymShort(m), cartao: db.cards.find(c => c.id === p.cartaoId)?.nome || '—',
        descricao: compra?.descricao || '—', parcela: `${p.numero}/${p.total}`,
        valor: p.valor, categoria: compra?.categoria || '—', status: p.status, totalMes,
        _first: p === parcelas[0],
      });
    }
  }
  return card(`Mapa de parcelamentos futuros (${fmt(futureInstallmentsTotal(ymAdd(ym, -1)))} comprometidos a partir de ${ymLabel(ym)})`,
    table([
      { label: 'Mês', render: r => r._first ? h('b', {}, r.mes) : h('span', { style: 'color:var(--ink-2)' }, r.mes) },
      { label: 'Cartão', k: 'cartao' },
      { label: 'Descrição', k: 'descricao' },
      { label: 'Parcela', k: 'parcela' },
      { label: 'Valor', k: 'valor', money: true },
      { label: 'Categoria', k: 'categoria' },
      { label: 'Status', render: r => badge(r.status) },
      { label: 'Total do mês', render: r => r._first ? h('b', {}, fmt(r.totalMes)) : '', right: true },
    ], rows, { empty: 'Nenhuma parcela futura cadastrada.' }));
}

// ---- Importação em massa ----
const IMPORT_HEADERS = 'descricao;categoria;cartao;valor_parcela;parcela_atual;total_parcelas;mes_inicial;valor_total;responsavel;observacoes';
const EXAMPLE = 'Notebook;Casa;Nubank;250,00;3;10;08/2026;2500,00;Suellen;compra da Magalu';

function importModal(rerender) {
  const ta = h('textarea', {
    rows: 8, style: 'width:100%;font-family:monospace;font-size:12px',
    placeholder: `${IMPORT_HEADERS}\n${EXAMPLE}`,
  });
  const fileInput = h('input', { type: 'file', accept: '.csv,.txt,.tsv' });
  fileInput.addEventListener('change', () => {
    const f = fileInput.files[0];
    if (f) f.text().then(t => { ta.value = t; });
  });
  const result = h('div', { class: 'stat-sub', style: 'margin-top:8px' });

  const overlay = modal('Importar parcelamentos em massa', h('div', {},
    h('p', { class: 'stat-sub' },
      'Cole a tabela (do Excel, Google Sheets ou CSV) ou envie um arquivo. A primeira linha deve conter os cabeçalhos. Separadores aceitos: ponto e vírgula, vírgula ou tabulação.'),
    h('p', { class: 'stat-sub' }, 'Colunas reconhecidas: ', h('code', {}, IMPORT_HEADERS.replaceAll(';', ' · '))),
    fileInput, h('div', { style: 'height:8px' }), ta, result,
    h('div', { class: 'modal-actions' },
      h('button', { class: 'btn btn-ghost', onclick: () => overlay.remove() }, 'Cancelar'),
      h('button', { class: 'btn btn-primary', onclick: () => {
        const res = importRows(ta.value);
        if (res.error) { result.textContent = res.error; result.style.color = 'var(--erro)'; return; }
        overlay.remove();
        toast(`${res.count} parcelamento(s) importado(s) e somado(s) à coleção existente.`);
        rerender();
      } }, 'Importar'))), { wide: true });
}

function importRows(text) {
  const { rows } = parseTable(text);
  if (!rows.length) return { error: 'Nenhuma linha encontrada. Cole os dados com a linha de cabeçalho.' };
  const col = (r, ...names) => {
    for (const n of names) {
      const key = Object.keys(r).find(k => k.replace(/[\s_-]/g, '') === n.replace(/[\s_-]/g, ''));
      if (key && r[key] !== '') return r[key];
    }
    return '';
  };
  let count = 0;
  const errors = [];
  rows.forEach((r, idx) => {
    const descricao = col(r, 'descricao', 'descrição', 'item');
    const valorParcela = parseMoney(col(r, 'valor_parcela', 'valor da parcela', 'parcela_valor', 'valor'));
    const totalParcelas = parseInt(col(r, 'total_parcelas', 'total de parcelas', 'parcelas', 'qtd_parcelas')) || 1;
    const parcelaAtual = parseInt(col(r, 'parcela_atual', 'parcela atual', 'parcela')) || 1;
    const mesInicial = parseYm(col(r, 'mes_inicial', 'mês inicial', 'mes_inicio', 'inicio')) || ymNow();
    if (!descricao || !valorParcela) { errors.push(idx + 2); return; }
    const cartaoNome = col(r, 'cartao', 'cartão');
    let cartao = db.cards.find(c => c.nome.toLowerCase() === cartaoNome.toLowerCase());
    if (!cartao && cartaoNome) cartao = add('cards', { nome: cartaoNome, banco: '', limitePlanejado: 0, ativo: true });
    const purchase = add('purchases', {
      descricao,
      dataCompra: todayISO(),
      categoria: col(r, 'categoria') || 'Outros',
      valorTotal: parseMoney(col(r, 'valor_total', 'valor total')) || valorParcela * totalParcelas,
      numParcelas: totalParcelas,
      parcelaInicial: parcelaAtual,
      valorParcela,
      cartaoId: cartao?.id || '',
      mesInicio: mesInicial,
      responsavel: col(r, 'responsavel', 'responsável'),
      reembolsavel: false,
      obs: col(r, 'observacoes', 'observações', 'obs') + ' (importado em massa)',
    });
    db.installments.push(...generateInstallments(purchase));
    count++;
  });
  save();
  if (!count) return { error: `Nenhuma linha válida. Verifique descrição e valor da parcela (linhas: ${errors.join(', ')}).` };
  return { count };
}

return { generateInstallments, ensureReimbursementSync, render, addCard };
})();

          rerender();
        }) }, '+ Nova provisão')),
    table([

      { label: 'Alvo', render: p => `${fmt(p.valorAlvo)} até ${p.dataAlvo ? ymLabel(p.dataAlvo) : '—'}` },
      { label: 'Mensal sugerido', render: p => fmt(provisionMonthly(p, ym)), right: true },
      { label: 'Acumulado', render: p => {
          const pct = p.valorAlvo > 0 ? Math.min(100, (p.valorAcumulado / p.valorAlvo) * 100) : 0;
          return h('div', { style: 'min-width:130px' },
            h('div', {}, `${fmt(p.valorAcumulado)} (${pct.toFixed(0)}%)`),
            h('div', { class: 'commit-meter', style: 'margin:4px 0 0' },
              h('div', { style: `width:${pct}%;background:${pct >= 100 ? '#7BC99A' : '#BFE8D5'}` })));
        } },
      { label: 'Status', render: p => {
          const atrasada = p.status === 'ativa' && p.dataAlvo && ymDiff(p.dataAlvo, ym) >= 0 &&
            p.valorAcumulado < esperadoAte(p, ym);
          return atrasada ? badge('atrasado') : badge(p.status);
        } },
      { label: '', render: p => rowActions(
          ['💰', () => depositModal(p, rerender), 'Registrar valor guardado'],
          ['✏️', () => formModal('Editar provisão', fields(), p, vals => { update('provisions', p.id, vals); rerender(); }), 'Editar'],
          [p.status === 'ativa' ? '⏸' : '▶️', () => { update('provisions', p.id, { status: p.status === 'ativa' ? 'pausada' : 'ativa' }); rerender(); }, p.status === 'ativa' ? 'Pausar' : 'Reativar'],
          ['🗑', () => confirmModal(`Excluir a provisão "${p.nome}"?`, () => { remove('provisions', p.id); rerender(); }), 'Excluir']), right: true },
    ], db.provisions, { empty: 'Nenhuma provisão. Crie provisões para IPVA, seguro, viagens e presentes — assim nada vira surpresa.' })));
}

// Quanto deveria estar acumulado até este mês, mantendo o ritmo sugerido.
function esperadoAte(p, ym) {
  if (!p.dataAlvo) return 0;
  const restantes = Math.max(0, ymDiff(p.dataAlvo, ym));
  const mensal = provisionMonthly(p, ym);
  return Math.max(0, p.valorAlvo - mensal * restantes);
}

function depositModal(p, rerender) {
  formModal(`Guardar para "${p.nome}"`, [
    { k: 'valor', label: 'Valor guardado (R$)', type: 'money', required: true, value: Math.round(provisionMonthly(p, ui.month) * 100) / 100 },
    { k: 'mes', label: 'Mês', type: 'month', required: true, value: ui.month },
  ], {}, vals => {
    add('provisionDeposits', { provisaoId: p.id, mes: vals.mes, valor: vals.valor });
    const novoAcumulado = (Number(p.valorAcumulado) || 0) + vals.valor;
    update('provisions', p.id, {
      valorAcumulado: novoAcumulado,
      status: novoAcumulado >= p.valorAlvo ? 'concluida' : p.status,
    });
    toast(novoAcumulado >= p.valorAlvo ? 'Provisão concluída! 🎉' : 'Valor registrado na provisão.');
    rerender();
  }, { saveLabel: 'Registrar' });
}

return { render };
})();

            remove('investRedemptions', r.id);
            rerender();
          }), 'Excluir']), right: true },
      ], resgates)));
  }
}

function agrupa(keyFn) {
  const map = {};
  for (const i of db.investments) {
    const k = keyFn(i) || 'Outros';
    map[k] = (map[k] || 0) + (Number(i.valorAtual) || 0);

}

// Registra um resgate: reduz o saldo do investimento de origem e lança automaticamente

function resgateModal(inv, rerender) {

    const saldoAtualizado = +(saldoAnterior - valor).toFixed(2);

    update('investments', inv.id, { valorAtual: saldoAtualizado });

    const income = add('incomes', {
      data: vals.data,
      descricao: `Resgate de investimento, ${inv.produto}`,
      categoria: 'Movimentação patrimonial',
      tipo: 'resgate_investimento',
      valor,
      status: 'recebida',
      origem: `${inv.banco}, ${inv.produto}`,
    });

    add('investRedemptions', {
      investimentoId: inv.id, data: vals.data, valor,
      saldoAnterior, saldoAtualizado,
      bancoOrigem: inv.banco, produtoOrigem: inv.produto,
      contaDestino: vals.contaDestino || '', obs: vals.obs || '',
      incomeId: income.id,
    });

    toast(`Resgate registrado. Novo saldo: ${fmt(saldoAtualizado)}.`);
    rerender();
  }, { saveLabel: 'Registrar resgate' });
}

return { render };

// Parcela X/Y correspondente a um reembolso ligado a uma compra do cartão (ou '—' se avulso).
function parcelaLabel(r) {
  if (!r.purchaseId || !r.mes) return '—';
  const i = db.installments.find(x => x.purchaseId === r.purchaseId && x.mes === r.mes);
  return i ? `${i.numero}/${i.total}` : '—';
}

// Monta o grupo completo de um parcelamento (todos os meses, independente do mês selecionado).
function buildGroup(purchaseId) {
  const items = db.reimbursements
    .filter(r => r.purchaseId === purchaseId && r.status !== 'cancelado')
    .sort((a, b) => (a.mes || '').localeCompare(b.mes || ''));
  if (!items.length) return null;
  const purchase = db.purchases.find(p => p.id === purchaseId);
  const installmentsOf = db.installments.filter(i => i.purchaseId === purchaseId).sort((a, b) => a.numero - b.numero);
  return {
    purchaseId, items,
    pessoa: db.people.find(p => p.id === items[0]?.pessoaId),
    descricao: purchase?.descricao || items[0]?.descricao || '—',
    totalAReembolsar: sum(items, r => r.valorAReembolsar),
    totalRecebido: sum(items, r => r.valorRecebido),
    totalPendente: sum(items, reimbPending),
    terminaEm: installmentsOf.length ? installmentsOf[installmentsOf.length - 1].mes : items[items.length - 1]?.mes,
  };
}

// Agrupa os reembolsos de compras parceladas por compra: total do parcelamento, quanto
// falta, quanto é neste mês e em que mês termina — a visão que responde "quando acaba".
function purchaseGroups(ym, pessoaId) {
  const ids = new Set(db.reimbursements
    .filter(r => r.purchaseId && r.status !== 'cancelado' && (!pessoaId || r.pessoaId === pessoaId))
    .map(r => r.purchaseId));
  const groups = [];
  for (const purchaseId of ids) {
    const g = buildGroup(purchaseId);
    if (!g || g.totalPendente <= 0.004) continue; // parcelamento já quitado por completo
    const thisMonth = g.items.find(r => r.mes === ym);
    groups.push({
      ...g,
      valorMes: thisMonth ? reimbPending(thisMonth) : 0,
      statusMes: thisMonth ? thisMonth.status : null,
      parcelaMes: thisMonth ? parcelaLabel(thisMonth) : '—',
    });
  }
  return groups.sort((a, b) => (a.terminaEm || '').localeCompare(b.terminaEm || ''));
}

// Provisão de reembolsos futuros: quanto ainda está em aberto mês a mês, olhando para

    btns.push(['💵', () => receberModal(r, rerender), 'Registrar recebimento']);
  }

function receberModal(r, rerender) {
  formModal(`Receber de ${db.people.find(p => p.id === r.pessoaId)?.nome || ''}`, [
    { k: 'valor', label: `Valor recebido (pendente: ${fmt(reimbPending(r))})`, type: 'money', required: true, value: reimbPending(r) },
    { k: 'data', label: 'Data do recebimento', type: 'date', required: true, value: todayISO() },
  ], {}, vals => {
    const recebido = (Number(r.valorRecebido) || 0) + vals.valor;
    const quitado = recebido >= Number(r.valorAReembolsar) - 0.005;
    update('reimbursements', r.id, {
      valorRecebido: recebido,
      dataRecebimento: vals.data,
      status: quitado ? 'pago' : 'parcial',
    });
    // Reembolso recebido abate a despesa original (não vira receita livre).
    if (quitado && r.expenseId) {
      const exp = db.expenses.find(e => e.id === r.expenseId);
      if (exp && exp.status === 'pago') update('expenses', exp.id, { status: 'reembolsado' });
    }
    toast(quitado ? 'Reembolso quitado e abatido da despesa original.' : 'Recebimento parcial registrado.');
    rerender();
  }, { saveLabel: 'Registrar recebimento' });
}

function novaDespesaReembolsavel(rerender) {

    .filter(r => r.pessoaId === pessoa.id && ['pendente', 'solicitado', 'parcial', 'atrasado'].includes(r.status) && reimbPending(r) > 0)

    const items = escopo === 'mes' ? pendentes.filter(r => reimbMonth(r) === ymPadrao) : pendentes;
    const total = sum(items, reimbPending);

    const resumida = total > 0
      ? `Oi! Fechando aqui os valores pendentes${rotuloMes}, ficou ${fmt(total)} para me reembolsar.`
      : `Oi! Não há pendências${rotuloMes} no momento. 🎉`;
    const detalhada = items.length
      ? `${resumida}\n\nDetalhamento:\n${items.map(r => `${fmtDate(r.data)}, ${r.descricao}: ${fmt(reimbPending(r))}`).join('\n')}\n\nTotal: ${fmt(total)}.`
      : resumida;
    return { items, total, resumida, detalhada };
  };

  let escopo = 'mes';
  let modo = 'resumida';
  const atual = () => montar(escopo);

  const ta = h('textarea', { rows: 10, style: 'width:100%;font-size:13px' }, atual().resumida);
  const linkZap = pessoa.contato ? h('a', {
    class: 'btn btn-secondary', target: '_blank', rel: 'noopener',
    href: `https://wa.me/${String(pessoa.contato).replace(/\D/g, '')}?text=${encodeURIComponent(ta.value)}`,

    ev.push({ tipo: 'recorrente', data: o.dataVencimento, titulo: o.nome, valor: o.valor, status: o.status });
  }

  if (prov > 0) ev.push({ tipo: 'provisao', data: dateInMonth(ym, 1), titulo: 'Provisões do mês', valor: prov, status: 'previsto' });

  if (aportes > 0) ev.push({ tipo: 'investimento', data: dateInMonth(ym, 1), titulo: 'Aportes planejados', valor: aportes, status: 'previsto' });
  for (const r of monthReimbursements(ym)) {
    if (reimbPending(r) > 0) {

      .map(([k, label]) => h('span', { class: 'legend-item' },

function diagnostico(ym, s, extra) {

  for (const e of s.expenses.filter(e => e.natureza !== 'fixa')) {
    porCat[e.categoria || 'Sem categoria'] = (porCat[e.categoria || 'Sem categoria'] || 0) + expenseNet(e);

  const top = Object.entries(porCat).sort((a, b) => b[1] - a[1]).slice(0, 2).filter(([, v]) => v > 0);
  if (top.length) frases.push(`O maior peso dos gastos variáveis veio de ${top.map(([c, v]) => `${c} (${fmt(v)})`).join(' e ')}.`);

  if (novasParcelas.length) {
    const fim = novasParcelas.map(p => ymAdd(p.mesInicio, Number(p.numParcelas) - Number(p.parcelaInicial || 1))).sort().pop();

  if (s.comprometimento > 85) frases.push(`Atenção: ${s.comprometimento.toFixed(0)}% da renda segura está comprometida — acima do nível recomendado.`);
  else if (s.comprometimento > 70) frases.push(`O comprometimento da renda ficou em ${s.comprometimento.toFixed(0)}%, um pouco acima do confortável.`);
  else if (s.receitaSegura > 0) frases.push(`O comprometimento da renda ficou em ${s.comprometimento.toFixed(0)}%, dentro de um nível saudável.`);

// Módulo do carro: custos consolidados de todas as despesas ligadas ao carro + abastecimentos.

const SUBCATS = ['Financiamento', 'Combustível', 'Seguro', 'Manutenção', 'Revisão', 'IPVA', 'Estacionamento', 'Lavagem', 'Multas', 'Outros'];

function categoriasAtivas() {
  return db.settings.carroCategoriasAtivas || CATEGORIAS_CARRO;
}

function isCarro(categoria) {
  return categoriasAtivas().includes(categoria);
}

function toggleCategoria(cat, rerender) {
  const ativas = new Set(categoriasAtivas());
  if (ativas.has(cat)) ativas.delete(cat); else ativas.add(cat);
  db.settings.carroCategoriasAtivas = CATEGORIAS_CARRO.filter(c => ativas.has(c));
  save();
  rerender();
}

// Todas as despesas do carro em um mês (avulsas + recorrentes + parcelas), incluindo os
// abastecimentos — eles também precisam entrar no total, nos gráficos e nos lançamentos.
function carItems(ym) {
  const out = [];
  const refuelingByExpenseId = new Map(db.refuelings.filter(r => r.expenseId).map(r => [r.expenseId, r]));
  for (const e of monthExpenses(ym).filter(e => isCarro(e.categoria))) {
    const abastecimento = refuelingByExpenseId.get(e.id);
    const descricao = abastecimento
      ? `Abastecimento — ${Number(abastecimento.litros).toFixed(2)}L a ${fmt(abastecimento.precoLitro)}/L (${Number(abastecimento.kmRegistrado).toLocaleString('pt-BR')} km)`
      : e.descricao;
    out.push({ data: e.dataVencimento || e.dataCompra, descricao, sub: e.subcategoria || e.categoria, valor: expenseNet(e), status: e.status });
  }
  for (const o of recurringOccurrences(ym).filter(o => isCarro(o.categoria))) {
    out.push({ data: o.dataVencimento, descricao: o.nome, sub: o.categoria, valor: o.valor, status: o.status });
  }
  for (const p of monthInstallments(ym)) {
    const compra = db.purchases.find(c => c.id === p.purchaseId);
    if (compra && isCarro(compra.categoria)) {
      out.push({ data: `${p.mes}-01`, descricao: `${compra.descricao} (${p.numero}/${p.total})`, sub: compra.subcategoria || compra.categoria, valor: installmentNet(p), status: p.status });
    }
  }
  return out;
}

        { sub: fuelMes.km ? `${fuelMes.km} km rodados` : 'precisa de 2 abastecimentos seguidos' }),

      statCard(`Custo médio por km no ano`, fuelAno.custoPorKm != null ? `${fmt(fuelAno.custoPorKm)}/km` : '—')),

    renderRefuelingsTable(ym, rerender)));

  // Por subcategoria
  const porSub = {};
  for (const i of items) porSub[i.sub || 'Outros'] = (porSub[i.sub || 'Outros'] || 0) + i.valor;
  el.append(h('div', { class: 'grid grid-2' },

  el.append(card('Lançamentos do carro no mês',
    table([
      { label: 'Data', k: 'data', date: true },
      { label: 'Descrição', k: 'descricao' },
      { label: 'Categoria', k: 'sub' },
      { label: 'Valor', k: 'valor', money: true },
      { label: 'Status', render: i => badge(i.status) },
    ], items.sort((a, b) => a.data.localeCompare(b.data)),
    { empty: `Nenhuma despesa do carro neste mês. Categorias incluídas: ${ativas.join(', ') || 'nenhuma selecionada acima'}. Subcategorias sugeridas: ${SUBCATS.join(', ')}.` })));

  if (provCarro.length) {
    el.append(card('Provisões ligadas ao carro',
      table([
        { label: 'Provisão', k: 'nome' },

      ], provCarro)));
  }
}

// Mantém a despesa vinculada ao abastecimento em sincronia — some na fatura do cartão (via
// cardInvoice) e entra no orçamento normalmente, sem precisar cadastrar duas vezes.
function syncRefuelingExpense(refueling) {
  const patch = {
    dataCompra: refueling.data, dataVencimento: refueling.data,
    descricao: `Abastecimento — ${Number(refueling.litros).toFixed(2)}L`,
    categoria: 'Combustível', valorTotal: Number(refueling.valorTotal) || 0,
    formaPagamento: refueling.formaPagamento, banco: refueling.banco,
    cartaoId: refueling.formaPagamento === 'Cartão de crédito' ? refueling.cartaoId : '',
    natureza: 'variavel', status: 'pago', dataPagamento: refueling.data,
    responsavel: '', reembolsavel: false,
  };
  if (refueling.expenseId && db.expenses.some(e => e.id === refueling.expenseId)) {
    update('expenses', refueling.expenseId, patch);
  } else {
    const exp = add('expenses', patch);
    update('refuelings', refueling.id, { expenseId: exp.id });
  }
}

function saveRefueling(vals, existingId) {
  const refueling = existingId ? update('refuelings', existingId, vals) : add('refuelings', vals);
  syncRefuelingExpense(refueling);
  save();
}

function refuelingModal(rerender, existing) {
  formModal(existing ? 'Editar abastecimento' : 'Novo abastecimento', refuelingFields(), existing || {}, vals => {
    saveRefueling(vals, existing?.id);
    toast(existing ? 'Abastecimento atualizado.' : 'Abastecimento registrado.');
    rerender();
  }, { wide: true });
}

// Card de sincronização entre dispositivos via Supabase.
function cloudCard(rerender) {
  const status = h('div', { class: 'stat-sub', style: 'margin-bottom:10px' });
  const refreshStatus = () => {
    const s = sync.state;
    if (sync.isLoggedIn()) {
      status.innerHTML = '';
      status.append(badge(s.status === 'erro' ? 'atrasado' : 'ativa'), ' ',
        `Conectada como ${sync.userEmail()}.`,
        s.lastSync ? ` Última sincronização: ${s.lastSync.toLocaleTimeString('pt-BR')}.` : '',
        s.error ? ` Erro: ${s.error}` : '');
    } else if (sync.isConfigured()) {
      status.textContent = 'Projeto já configurado (embutido no app). Só falta entrar: use "Criar conta" na primeira vez e depois "Entrar" com o mesmo e-mail e senha em todos os aparelhos.';
    } else {
      status.textContent = 'Sem sincronização: seus dados existem só neste navegador. Conecte um projeto Supabase para usar no celular e no computador ao mesmo tempo.';
    }
  };
  refreshStatus();

  const actions = [];
  if (!sync.isConfigured()) {
    actions.push(h('button', { class: 'btn btn-primary btn-sm', onclick: () =>
      formModal('Conectar ao Supabase', [
        { k: 'url', label: 'ID do projeto, URL ou link de conexão', type: 'text', required: true, full: true, placeholder: 'ex.: fsclryvylknuooayreet ou https://xxxx.supabase.co', help: 'Supabase → Settings → General → Project ID. Se recebeu um link de conexão de outro aparelho, cole-o aqui e deixe a chave em branco.' },
        { k: 'anonKey', label: 'Chave anon (public)', type: 'text', full: true, help: 'Supabase → Settings → API → anon public (texto longo começando com "eyJ"). Antes, rode o script supabase/schema.sql no SQL Editor.' },
      ], {}, vals => {
        // Aceita também um "link de conectar aparelho" colado inteiro no primeiro campo.
        const fromLink = sync.parseConnectInput(vals.url);
        if (fromLink) {
          sync.setConfig(fromLink.url, fromLink.anonKey);
        } else {
          if (!sync.normalizeUrl(vals.url)) return 'Informe o ID do projeto (letras/números), a URL https://xxxx.supabase.co ou cole um link de conexão.';
          if (!vals.anonKey) return 'Informe a chave anon (ou cole um link de conexão no primeiro campo).';
          sync.setConfig(vals.url, vals.anonKey);
        }
        toast('Projeto configurado. Teste a configuração ou crie sua conta.');
        rerender();
      }, { saveLabel: 'Conectar' }) }, '🔗 Conectar projeto Supabase'));
  } else if (!sync.isLoggedIn()) {
    actions.push(
      h('button', { class: 'btn btn-primary btn-sm', onclick: () => loginPrompt(rerender).entrar() }, '🔑 Entrar'),
      h('button', { class: 'btn btn-secondary btn-sm', onclick: () => loginPrompt(rerender).criar() }, '＋ Criar conta'),
      h('button', { class: 'btn btn-ghost btn-sm', onclick: () => { sync.disconnect(); rerender(); } }, 'Remover configuração'));
  } else {
    actions.push(
      h('button', { class: 'btn btn-primary btn-sm', onclick: () => {
        sync.syncNow().then(r => { toast(r.changed ? 'Dados atualizados a partir da nuvem.' : 'Dados enviados para a nuvem.'); rerender(); })
          .catch(e => { toast('Falha ao sincronizar: ' + e.message); rerender(); });
      } }, '🔄 Sincronizar agora'),
      h('button', { class: 'btn btn-ghost btn-sm', onclick: () => { sync.signOut(); toast('Sessão encerrada. Os dados continuam neste navegador.'); rerender(); } }, 'Sair da conta'));
  }

  if (sync.isConfigured()) {
    actions.push(
      h('button', { class: 'btn btn-secondary btn-sm', onclick: () => connectLinkModal() }, '📲 Conectar outro aparelho'),
      h('button', { class: 'btn btn-ghost btn-sm', onclick: () => testSetupModal() }, '🔍 Testar configuração'));
  }

  return card('☁️ Sincronização entre dispositivos (Supabase)',
    status,
    h('div', { style: 'display:flex;gap:8px;flex-wrap:wrap' }, actions),
    h('p', { class: 'stat-sub', style: 'margin-top:10px' },
      'Passo a passo: crie um projeto gratuito em supabase.com, rode o script ',
      h('code', {}, 'supabase/schema.sql'),
      ' no SQL Editor, copie a URL e a chave anon em Settings → API e conecte aqui. Use o mesmo e-mail e senha no celular e no computador.'));

  { path: 'calendario', label: 'Calendário', icon: '🗓️', view: calendario, month: true },
  { path: 'receitas', label: 'Receitas', icon: '💰', view: receitas, month: true },
  { path: 'despesas', label: 'Despesas', icon: '🧾', view: despesas, month: true },
  { path: 'cartoes', label: 'Cartões e parcelas', icon: '💳', view: cartoes, month: true },
  { path: 'recorrentes', label: 'Contas recorrentes', icon: '🔁', view: recorrentes, month: true },
  { path: 'provisoes', label: 'Provisões', icon: '🏦', view: provisoes, month: true },
  { path: 'investimentos', label: 'Investimentos', icon: '📈', view: investimentos, month: true },
  { path: 'reembolsos', label: 'Reembolsos', icon: '🤝', view: reembolsos, month: true },
  { path: 'simulador', label: 'Simulador de compra', icon: '🧮', view: simulador },
  { path: 'carro', label: 'Carro', icon: '🚗', view: carro, month: true },
  { path: 'fechamento', label: 'Fechamento mensal', icon: '✅', view: fechamento, month: true },
  { path: 'relatorios', label: 'Relatórios', icon: '📊', view: relatorios },
  { path: 'config', label: 'Configurações', icon: '⚙️', view: config },
];

const MOBILE_NAV = ['dashboard', 'calendario', 'despesas', 'cartoes', 'reembolsos', 'investimentos', 'provisoes', 'relatorios', 'config'];

function currentRoute() {
  const path = (location.hash || '#/dashboard').replace(/^#\//, '').split('?')[0];
  return ROUTES.find(r => r.path === path) || ROUTES[0];
}

function render() {
  const route = currentRoute();
  const app = document.getElementById('app');
  app.innerHTML = '';

  // Sidebar (desktop)
  const sidebar = h('nav', { class: 'sidebar' },
    h('div', { class: 'logo' }, '🌿 Meu Orçamento', h('small', {}, 'Inteligente')),
    ROUTES.map(r => h('a', {
      class: `nav-link ${r.path === route.path ? 'active' : ''}`, href: `#/${r.path}`,
    }, h('span', { class: 'nav-icon' }, r.icon), r.label)));

  // Menu inferior (mobile)
  const bottomNav = h('nav', { class: 'bottom-nav' },
    MOBILE_NAV.map(p => {
      const r = ROUTES.find(x => x.path === p);
      return h('a', { class: r.path === route.path ? 'active' : '', href: `#/${r.path}` },
        h('span', { class: 'nav-icon' }, r.icon), r.label.split(' ')[0]);
    }));

  // Barra superior com seletor de mês
  const topbar = h('div', { class: 'topbar' },
    h('h1', {}, route.icon + ' ' + route.label),
    route.month !== false && route.month ? monthPicker() : null);

  const content = h('div', {});
  const main = h('main', { class: 'main' }, topbar, content);

  app.append(sidebar, main, bottomNav,
    h('button', { class: 'fab', title: 'Nova despesa', onclick: () => despesas.quickAdd(render) }, '+'));

  route.view.render(content, render);

  if (!db.settings.onboardingDone && !document.querySelector('.modal-overlay')) showOnboarding();
}

function monthPicker() {
  return h('div', { class: 'month-picker' },
    h('button', { onclick: () => { ui.month = ymAdd(ui.month, -1); render(); } }, '‹'),
    h('span', { class: 'month-label' }, ymLabel(ui.month)),
    h('button', { onclick: () => { ui.month = ymAdd(ui.month, 1); render(); } }, '›'));
}

function showOnboarding() {
  // Aparelho que já tem conta em outro lugar: pular o formulário de renda e
  // ir direto para o login evita criar uma base local que depois diverge da nuvem.
  if (sync.isConfigured() && !sync.isLoggedIn()) {
    const already = modal('Bem-vinda de volta 🌿', h('div', {},
      h('p', {}, 'Você já usa o Meu Orçamento Inteligente em outro aparelho?'),
      h('div', { class: 'modal-actions', style: 'justify-content:flex-start' },
        h('button', {
          class: 'btn btn-primary', onclick: () => {
            already.remove();
            config.loginPrompt(render).entrar();
          },
        }, '🔑 Sim, já tenho conta — Entrar'),
        h('button', {
          class: 'btn btn-ghost', onclick: () => { already.remove(); showOnboardingForm(); },
        }, 'Não, é meu primeiro acesso'))));
    return;
  }
  showOnboardingForm();
}

function showOnboardingForm() {
  const steps = [
    ['Informe sua renda segura mensal e suas metas', null],
    ['Cadastre seus bancos e cartões', '#/config'],
    ['Cadastre suas contas recorrentes (aluguel, luz, assinaturas…)', '#/recorrentes'],
    ['Importe seus parcelamentos existentes em massa', '#/cartoes'],
    ['Cadastre as pessoas que devem reembolsos a você', '#/config'],
    ['Acompanhe tudo pelo Dashboard', '#/dashboard'],
  ];
  const overlay = formModal('Bem-vinda ao Meu Orçamento Inteligente 🌿', [
    { k: 'nome', label: 'Como podemos te chamar?', type: 'text', placeholder: 'Seu nome' },
    { k: 'rendaSegura', label: 'Renda segura mensal (R$)', type: 'money', required: true, help: 'Salário e rendas garantidas. Você poderá detalhar depois em Receitas.' },
    { k: 'metaReservaMin', label: 'Meta mínima de reserva (R$)', type: 'money', value: db.settings.metaReservaMin },
    { k: 'aporteMinimoMensal', label: 'Aporte mensal desejado (R$)', type: 'money' },
  ], { ...db.settings }, vals => {
    Object.assign(db.settings, vals, { onboardingDone: true });
    // Cria a receita segura recorrente inicial
    if (vals.rendaSegura > 0 && !db.incomes.length) {
      db.incomes.push({
        id: 'renda-inicial', data: `${ui.month}-05`, descricao: 'Salário',
        categoria: 'Salário fixo', valor: vals.rendaSegura, tipo: 'segura',
        status: 'prevista', recorrente: true, obs: 'Criada no primeiro acesso',
      });
    }
    save();
    modal('Próximos passos', h('div', {},
      steps.map(([txt, href], i) => h('div', { class: 'onboard-step' },
        h('span', { class: 'onboard-num' }, i + 1),
        href ? h('a', { href, onclick: () => document.querySelector('.modal-overlay')?.remove() }, txt) : h('span', {}, txt)))));
    render();
  }, { saveLabel: 'Começar' });
  // onboarding não pode ser fechado clicando fora sem preencher — mas permitimos fechar e usar depois
  overlay.querySelector('.icon-btn').addEventListener('click', () => {
    db.settings.onboardingDone = true; save();
  });
}

window.addEventListener('hashchange', render);
// Se o app foi aberto por um "link de conectar aparelho", aplica a configuração antes de tudo.
if (sync.applyConnectFromHash()) {
  toast('Projeto configurado por link. Agora entre com seu e-mail e senha.');
  if (!location.hash.startsWith('#/config')) location.hash = '#/config';
}
sync.init(() => { toast('Dados atualizados a partir da nuvem.'); render(); });
render();

return { render };
})();
  </script>
</body>
</html>
